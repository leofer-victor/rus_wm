us_screen_pub:
  ros__parameters:
    probe_type: linear
    # Empty selects config/screen_cap_config_<probe_type>.yaml from this package.
    capture_profile: ""
    output_topic: /frame_grabber/us_img
    frame_id: ultrasound_frame

deepusnav_console:
  ros__parameters:
    ultrasound_topic: /frame_grabber/us_img
    robot_pose_topic: /fr3/current_pose
    robot_joint_state_topic: /fr3/joint_states
    robot_wrench_topic: /fr3/state/external_wrench
    robot_mode_topic: /fr3/state/mode
    inference_status_topic: /deepusnav/inference/status
    atlas_result_topic: /deepusnav/atlas/localisation
    inference_enable_service: /deepusnav/inference/set_enabled

    jog_command_topic: /deepusnav/operator/jog_command
    jog_status_topic: /deepusnav/operator/jog_status
    stop_service: /fr3/operator/stop
    reset_service: /fr3/operator/reset

    base_frame: fr3_link0
    tool_frame: fr3_hand_tcp
    state_timeout_sec: 0.5
    image_timeout_sec: 1.0
    default_jog_step_mm: 1.0
    max_jog_step_mm: 5.0
    command_cooldown_sec: 0.15

    cbct_directory: ""
    bag_directory: ~/deepusnav_bags
    record_topics:
      - /frame_grabber/us_img
      - /fr3/current_pose
      - /fr3/state/joint_states
      - /fr3/state/external_wrench
      - /fr3/state/mode
      - /deepusnav/inference/status
      - /deepusnav/inference/action_proposal
      - /deepusnav/atlas/localisation
      - /deepusnav/operator/jog_command
      - /deepusnav/operator/jog_status
      - /topic_joint_velocity_controller/target_pose

deepusnav_jog_adapter:
  ros__parameters:
    robot_pose_topic: /fr3/current_pose
    jog_command_topic: /deepusnav/operator/jog_command
    target_pose_topic: /topic_joint_velocity_controller/target_pose
    status_topic: /deepusnav/operator/jog_status

    # The controller interprets every target PoseStamped in the robot base frame.
    base_frame: fr3_link0
    tool_frame: fr3_hand_tcp

    # Guard every relative request before converting it to an absolute pose target.
    pose_timeout_sec: 0.5
    command_timeout_sec: 0.5
    max_jog_step_mm: 5.0
    min_command_interval_sec: 0.15
    require_controller_subscriber: true

    # Validate these conservative deployment bounds on the physical phantom setup.
    workspace_min_xyz_m: [-0.8, -0.8, 0.05]
    workspace_max_xyz_m: [0.8, 0.8, 1.0]

deepusnav_inference:
  ros__parameters:
    deepusnav_root: ~/projects/python_projects/deepusnav
    # dino | vjepa | atlas | dino_atlas | vjepa_atlas | custom
    model_profile: dino
    # Empty uses the checkpoint selected by model_profile.
    checkpoint_path: ""
    # Optional. When empty, the node runs checkpoint/latency health inference only.
    # With a grayscale target image, it also publishes a greedy policy-space proposal.
    goal_image_path: ""
    device: cuda

    # Population Atlas: frozen V-JEPA2 visual features -> metric embedding ->
    # k-nearest training-frame coordinates in the spine_cpr canonical frame.
    # Used only with model_profile=custom. Named profiles decide this automatically.
    atlas_enabled: false
    atlas_index_path: ~/projects/python_projects/deepusnav/training_setup_and_weights/atlas/heads/vjepa2_vitl__grid4x4__metric.pt
    atlas_target_path: ~/projects/python_projects/deepusnav/training_setup_and_weights/atlas/target_spine_cpr.json
    atlas_result_topic: /deepusnav/atlas/localisation
    atlas_k: 8
    atlas_target_tolerance_mm: 20.0

    ultrasound_topic: /frame_grabber/us_img
    robot_pose_topic: /fr3/current_pose
    status_topic: /deepusnav/inference/status
    proposal_topic: /deepusnav/inference/action_proposal
    enable_service: /deepusnav/inference/set_enabled

    state_timeout_sec: 0.5
    image_timeout_sec: 1.0
    inference_rate_hz: 2.0
